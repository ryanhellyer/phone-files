<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phone.hellyer.kiwi — files</title>
<style>
  :root {
    --bg: #f6f7f4;
    --surface: #ffffff;
    --ink: #1c2419;
    --ink-2: #5d6b58;
    --ink-3: #97a593;
    --accent: #6faf3e;
    --accent-ink: #3d7218;
    --accent-soft: #eaf3e2;
    --line: #e5eae1;
    --danger: #d84a3a;
    --danger-soft: #fdeceb;
    --keep: #3a6fd8;
    --keep-soft: #e9f0fc;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 140px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 26px 0 6px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .brand h1 {
    font-size: 1.05rem;
    font-weight: 750;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  .brand .sub {
    font-size: .78rem;
    font-weight: 600;
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: .85rem;
    font-weight: 650;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: #ccd6c7; color: var(--ink); }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 16px; height: 16px; }

  .btn.trash:hover { border-color: #bcd4a4; color: var(--accent-ink); background: var(--accent-soft); }

  .btn.select.active {
    background: var(--accent-soft);
    border-color: #b7d49c;
    color: var(--accent-ink);
  }

  /* ---------- path row ---------- */
  .pathrow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 14px;
  }

  .up-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .15s, color .15s, opacity .15s, transform .1s;
  }
  .up-btn:hover { color: var(--ink); border-color: #ccd6c7; }
  .up-btn:active { transform: scale(.94); }
  .up-btn:disabled { opacity: .3; cursor: default; }
  .up-btn:disabled:hover { color: var(--ink-2); border-color: var(--line); }
  .up-btn svg { width: 16px; height: 16px; }

  .crumbs {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 0;
  }
  .crumbs::-webkit-scrollbar { display: none; }

  .crumb {
    border: none;
    background: none;
    font: inherit;
    font-size: .95rem;
    font-weight: 650;
    color: var(--ink-2);
    padding: 5px 9px;
    border-radius: 8px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .crumb:hover { color: var(--ink); background: rgba(28,36,25,.05); }
  .crumb:last-child { color: var(--ink); pointer-events: none; }

  .crumb-sep {
    color: var(--ink-3);
    flex: 0 0 auto;
    user-select: none;
    font-size: .9rem;
  }

  /* ---------- list ---------- */
  .section-label {
    font-size: .72rem;
    font-weight: 750;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 18px 4px 8px;
  }

  .list {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    transition: background .13s ease, opacity .2s ease, transform .2s ease;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafbf8; }

  .row .glyph {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .row.file .glyph { background: #eef0ec; color: var(--ink-2); }
  .glyph svg { width: 19px; height: 19px; }

  .row .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: .95rem;
    font-weight: 550;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .meta {
    flex: 0 0 auto;
    font-size: .78rem;
    font-weight: 600;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .row .chev { flex: 0 0 auto; width: 15px; height: 15px; color: var(--ink-3); }

  /* ---------- selection ---------- */
  .check {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #c6cfc2;
    background: var(--surface);
    display: grid;
    place-items: center;
    transition: background .15s, border-color .15s;
  }
  .check svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .18s cubic-bezier(.34,1.56,.64,1); }
  .row.selected .check { background: var(--accent); border-color: var(--accent); }
  .row.selected .check svg { opacity: 1; transform: scale(1); }
  .row.selected { background: var(--accent-soft); }
  .row.selected:hover { background: #e2eed6; }

  .check { display: none; }
  body.selecting .check { display: grid; }
  body.selecting .chev { display: none; }
  body.selecting .row:hover { background: #fafbf8; }
  body.selecting .row.selected:hover { background: #e2eed6; }

  .row.dying { opacity: 0; transform: translateX(24px) scale(.98); }

  /* ---------- empty ---------- */
  .empty {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 70px 20px;
    color: var(--ink-3);
    text-align: center;
  }
  .empty.show { display: flex; }
  .empty svg { width: 40px; height: 40px; opacity: .5; }
  .empty h2 { font-size: 1rem; font-weight: 650; color: var(--ink-2); }
  .empty p { font-size: .85rem; max-width: 300px; line-height: 1.5; }

  /* ---------- action bar ---------- */
  .actionbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, rgba(246,247,244,0));
    transform: translateY(130%);
    transition: transform .28s cubic-bezier(.32,.72,.34,1);
    pointer-events: none;
  }
  body.selecting .actionbar { transform: translateY(0); pointer-events: auto; }

  .actionbar-inner {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 500px;
  }

  .action {
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 13px 10px;
    border: none;
    border-radius: 13px;
    font: inherit;
    font-size: .88rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .action svg { width: 17px; height: 17px; }
  .action:active { transform: scale(.96); }
  .action:disabled { opacity: .4; cursor: default; }
  .action:disabled:active { transform: none; }

  .action.del { background: var(--danger); color: #fff; box-shadow: 0 6px 18px rgba(216,74,58,.3); }
  .action.keep { background: var(--keep); color: #fff; box-shadow: 0 6px 18px rgba(58,111,216,.3); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translate(-50%, 14px);
    background: rgba(23, 32, 15, .92);
    color: #f2f6ee;
    font-size: .84rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    white-space: nowrap;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .page { padding: 0 14px 140px; }
    .topbar { padding-top: 18px; flex-wrap: wrap; }
    .btn { padding: 8px 12px; }
    .row { padding: 12px 14px; gap: 11px; }
    .row .meta { display: none; }
    body.selecting .row .meta { display: none; }
    .action span.label { display: none; }
    .action { font-size: .82rem; }
    .action.keep { font-size: .8rem; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="brand">
      <h1>phone.hellyer.kiwi</h1>
      <span class="sub">files</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn select" id="selectBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>
        <span>Select</span>
      </button>
      <button class="btn trash" id="trashBtn" title="Trash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8A.8.8 0 0 1 10.3 4h3.4a.8.8 0 0 1 .8.8V7M6.2 7l.8 12.2a1.8 1.8 0 0 0 1.8 1.7h6.4a1.8 1.8 0 0 0 1.8-1.7L17.8 7"/><path d="M10 11v6M14 11v6"/></svg>
        <span class="label">Trash</span>
      </button>
    </div>
  </div>

  <div class="pathrow">
    <button class="up-btn" id="upBtn" title="Go up" aria-label="Go up one directory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="Directory path"></nav>
  </div>

  <main>
    <div class="section-label" id="sectionLabel">Folders</div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <h2>This folder is empty</h2>
      <p>Everything here has been deleted.</p>
    </div>
  </main>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <button class="action del" id="delBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8A.8.8 0 0 1 10.3 4h3.4a.8.8 0 0 1 .8.8V7M6.2 7l.8 12.2a1.8 1.8 0 0 0 1.8 1.7h6.4a1.8 1.8 0 0 0 1.8-1.7L17.8 7"/><path d="M10 11v6M14 11v6"/></svg>
      <span class="label" id="delLabel">Delete</span>
    </button>
    <button class="action keep" id="keepBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4.6-3 8.2-7 9-4-.8-7-4.4-7-9V7z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
      <span class="label">Delete all but these</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- sample tree ---------- */
  const tree = {
    name: "", type: "dir", children: [
      { name: "Photos", type: "dir", children: [
        { name: "2025", type: "dir", children: [
          { name: "auckland-harbour.jpg", type: "file", size: "2.4 MB" },
          { name: "te-papa.jpg", type: "file", size: "3.1 MB" },
          { name: "roadtrip.mp4", type: "file", size: "88 MB" },
        ]},
        { name: "IMG_4821.heic", type: "file", size: "1.8 MB" },
        { name: "IMG_4822.heic", type: "file", size: "1.6 MB" },
      ]},
      { name: "Documents", type: "dir", children: [
        { name: "Work", type: "dir", children: [
          { name: "invoice-0412.pdf", type: "file", size: "212 KB" },
          { name: "brief.docx", type: "file", size: "48 KB" },
        ]},
        { name: "lease.pdf", type: "file", size: "1.1 MB" },
        { name: "recipes.txt", type: "file", size: "12 KB" },
        { name: "tax-2025.zip", type: "file", size: "26 MB" },
      ]},
      { name: "Music", type: "dir", children: [
        { name: "mixtape-01.flac", type: "file", size: "31 MB" },
        { name: "demos", type: "dir", children: [
          { name: "take-3.wav", type: "file", size: "94 MB" },
          { name: "take-7.wav", type: "file", size: "91 MB" },
        ]},
      ]},
      { name: "Downloads", type: "dir", children: [
        { name: "kiwi-wallpaper.png", type: "file", size: "5.2 MB" },
        { name: "firmware_v2.bin", type: "file", size: "12 MB" },
        { name: "old-setup.dmg", type: "file", size: "440 MB" },
      ]},
      { name: "notes.md", type: "file", size: "6 KB" },
      { name: "budget-numbers.csv", type: "file", size: "38 KB" },
      { name: "backup-2025.tar", type: "file", size: "1.9 GB" },
    ],
  };

  /* ---------- state ---------- */
  let path = [];
  let selecting = false;
  const selected = new Set();
  let pressTimer = null;

  /* ---------- dom ---------- */
  const $ = (id) => document.getElementById(id);
  const crumbsEl = $("crumbs"), listEl = $("list"), emptyEl = $("empty"),
        sectionEl = $("sectionLabel"), upBtn = $("upBtn"), selectBtn = $("selectBtn"),
        delBtn = $("delBtn"), keepBtn = $("keepBtn"), delLabel = $("delLabel"),
        toastEl = $("toast");

  const ICONS = {
    dir:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    file:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chev:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  };

  /* ---------- helpers ---------- */
  function currentDir() {
    let node = tree;
    for (const seg of path) node = node.children.find(c => c.name === seg);
    return node;
  }

  function itemsAt() {
    const c = currentDir().children || [];
    const dirs = c.filter(i => i.type === "dir");
    const files = c.filter(i => i.type === "file");
    return { dirs, files, all: [...dirs, ...files] };
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }

  function countDescendants(node) {
    let n = 0;
    for (const c of node.children || []) n += 1 + (c.type === "dir" ? countDescendants(c) : 0);
    return n;
  }

  /* ---------- render ---------- */
  function renderCrumbs() {
    crumbsEl.innerHTML = "";
    const parts = [{ label: "Files", seg: null }, ...path.map((p, i) => ({ label: p, seg: i }))];
    parts.forEach((p, i) => {
      if (i > 0) {
        const s = document.createElement("span");
        s.className = "crumb-sep";
        s.textContent = "›";
        crumbsEl.appendChild(s);
      }
      const b = document.createElement("button");
      b.className = "crumb";
      b.textContent = p.label;
      if (p.seg !== null) b.addEventListener("click", () => { path = path.slice(0, p.seg + 1); selected.clear(); render(); });
      crumbsEl.appendChild(b);
    });
    upBtn.disabled = path.length === 0;
  }

  function makeRow(item) {
    const row = document.createElement("div");
    row.className = item.type === "dir" ? "row folder" : "row file";
    row.dataset.name = item.name;

    const chk = document.createElement("span");
    chk.className = "check";
    chk.innerHTML = ICONS.check;

    const glyph = document.createElement("span");
    glyph.className = "glyph";
    glyph.innerHTML = item.type === "dir" ? ICONS.dir : ICONS.file;

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = item.type === "dir" ? countDescendants(item) + " items" : item.size;

    row.append(chk, glyph, name, meta);

    if (item.type === "dir") {
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.innerHTML = ICONS.chev;
      row.appendChild(chev);
    }

    row.addEventListener("click", () => {
      if (selecting) {
        row.classList.toggle("selected");
        row.classList.contains("selected") ? selected.add(item.name) : selected.delete(item.name);
        updateActions();
      } else if (item.type === "dir") {
        path.push(item.name);
        render();
      }
    });

    row.addEventListener("pointerdown", () => {
      if (selecting) return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { if (!selecting) setSelecting(true, item.name); }, 480);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
      row.addEventListener(ev, () => clearTimeout(pressTimer)));

    if (selected.has(item.name)) row.classList.add("selected");
    return row;
  }

  function render() {
    const { dirs, files } = itemsAt();
    listEl.innerHTML = "";
    selected.clear();

    const showDirs = dirs.length > 0, showFiles = files.length > 0;
    sectionEl.style.display = showDirs || showFiles ? "" : "none";
    emptyEl.classList.toggle("show", !showDirs && !showFiles);

    if (showDirs) {
      sectionEl.textContent = "Folders";
      dirs.forEach(d => listEl.appendChild(makeRow(d)));
    }
    if (showFiles) {
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = "Files";
      listEl.appendChild(label);
      files.forEach(f => listEl.appendChild(makeRow(f)));
    }
    renderCrumbs();
    updateActions();
  }

  /* ---------- selection ---------- */
  function setSelecting(on, firstName) {
    selecting = on;
    document.body.classList.toggle("selecting", on);
    selectBtn.classList.toggle("active", on);
    selected.clear();
    if (on && firstName) {
      selected.add(firstName);
      const row = listEl.querySelector(`[data-name="${CSS.escape(firstName)}"]`);
      if (row) row.classList.add("selected");
    }
    renderCrumbs();
    updateActions();
    if (on && !firstName) toast("Click or long-press items to select");
  }

  function updateActions() {
    const n = selected.size;
    delBtn.disabled = n === 0;
    keepBtn.disabled = n === 0;
    delLabel.textContent = n === 0 ? "Delete" : `Delete ${n} ${n === 1 ? "item" : "items"}`;
  }

  /* ---------- deletions ---------- */
  delBtn.addEventListener("click", () => {
    if (!selected.size) return;
    const names = new Set(selected);
    listEl.querySelectorAll(".row").forEach(r => { if (names.has(r.dataset.name)) r.classList.add("dying"); });
    setTimeout(() => {
      const dir = currentDir();
      dir.children = dir.children.filter(c => !names.has(c.name));
      toast("Moved to trash");
      setSelecting(false);
      render();
    }, 240);
  });

  keepBtn.addEventListener("click", () => {
    if (!selected.size) return;
    const dir = currentDir();
    const keep = new Set(selected);
    let removed = 0;
    dir.children.forEach(c => { if (!keep.has(c.name)) removed += 1 + (c.type === "dir" ? countDescendants(c) : 0); });
    dir.children = dir.children.filter(c => keep.has(c.name));
    toast(`${removed} ${removed === 1 ? "item" : "items"} moved to trash`);
    setSelecting(false);
    render();
  });

  /* ---------- controls ---------- */
  upBtn.addEventListener("click", () => {
    if (!path.length) return;
    if (selecting) { setSelecting(false); return; }
    path.pop();
    render();
  });

  selectBtn.addEventListener("click", () => setSelecting(!selecting));

  $("trashBtn").addEventListener("click", () => toast("Trash — 0 items"));

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && selecting) setSelecting(false);
  });

  render();
})();
</script>
</body>
</html>
